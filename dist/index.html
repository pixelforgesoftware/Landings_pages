quia San Francisco de Asís",parishCardDesc:"La vida de fe, los sacramentos, la catequesis, la caridad y la misión rural.",parishCardLink:"Conocer la Parroquia",schoolCardTitle:"Colegio Sagrada Familia de Nazareth",schoolCardDesc:"Una educación católica integral que crece junto a las familias de la comunidad.",schoolCardLink:"Conocer el Colegio"},stats:{parish:"Fundación de la Parroquia",school:"Inicio del Colegio",students:"Alumnos, aproximadamente",families:"Familias, aproximadamente",levels:"Niveles educativos"},timeline:{eyebrow:"Nuestra historia",title:"Un camino que sigue creciendo",link:"Conocer nuestra historia →",items:[{year:"1987",date:"5 de marzo",text:"La Parroquia San Francisco de Asís es erigida canónicamente."},{year:"2012",date:"5 de marzo",text:"Comienza sus actividades el Colegio."},{year:"2012",date:"2 de octubre",text:"Comienza el Jardín Maternal."},{year:"2014",date:"",text:"Comienza el Nivel Primario."},{year:"2021",date:"",text:"Comienza el Nivel Secundario."},{year:"Hoy",date:"",text:"La comunidad continúa creciendo con nuevos proyectos educativos y con la futura Capilla San José."}]},school:{eyebrow:"Colegio Sagrada Familia de Nazareth",title:"Educar es también evangelizar",intro:"El Colegio Parroquial Sagrada Familia de Nazareth nació de una necesidad concreta de la comunidad: ofrecer a los niños y jóvenes de Real del Padre una educación católica integral, cercana a sus familias y profundamente vinculada con la vida comunitaria.",levelsTitle:"Actualmente comprende",levels:[{name:"Jardín Maternal",desc:"Acompañamiento cercano en los primeros años de vida."},{name:"Nivel Inicial",desc:"Los primeros pasos de la vida escolar."},{name:"Nivel Primario",desc:"Una formación integral que crece junto a las familias."},{name:"Nivel Secundario",desc:"Jóvenes que se preparan para el futuro desde la fe."}],link:"Conocer el Colegio →"},values:{eyebrow:"Nuestros valores",title:"Lo que nos define",list:["Fe","Responsabilidad","Libertad","Caridad","Respeto",
